name: Build & Release APK

on:
  push:
    branches:
      - dev
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.9.8)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.parallel=true -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses & verify NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1" || true

      - name: Install and configure ccache
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ccache
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_DIR=${{ runner.temp }}/.ccache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=2G" >> $GITHUB_ENV
          echo "CCACHE_COMPRESS=1" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/**') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup release signing key
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > znote-release.jks
          else
            keytool -genkeypair -v -keystore znote-release.jks -alias znote -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass znotesandroid -keypass znotesandroid -dname "CN=zNotes, OU=zNotes, O=zNotes, L=Unknown, ST=Unknown, C=US"
          fi
          cp znote-release.jks app/znote-release.jks || true
          cat << 'EOF' > keystore.properties
          storeFile=znote-release.jks
          storePassword=znotesandroid
          keyAlias=znote
          keyPassword=znotesandroid
          EOF
          cp keystore.properties app/keystore.properties || true

      - name: Build Debug & Signed Release APKs
        run: ./gradlew assembleDebug assembleRelease --build-cache

      - name: Show ccache stats
        run: ccache -s || true

      - name: Prepare APK outputs
        id: prepare_apks
        run: |
          mkdir -p release-apks
          VERSION_NAME=$(grep 'versionName = "' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          
          # Single official signed release APK
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-apks/zNotes-v${VERSION_NAME}.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release-apks/zNotes-v${VERSION_NAME}-unsigned.apk
          fi
          
          # Debug APK for testing
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release-apks/zNotes-v${VERSION_NAME}-debug.apk
          fi
          ls -lh release-apks/

      - name: Generate Release Notes
        id: release_notes
        run: |
          cat << 'EOF' > release-notes.md
          ## zNotes v${{ env.VERSION_NAME }} Release

          ### Highlights & Features in v${{ env.VERSION_NAME }}
          - **Upstream v0.9.8 & v0.9.7 Merge**:
            - **Insert Space Tool**: Insert or remove vertical whitespace anywhere on note and PDF pages with clean ink and image slicing. Exported PDFs preserve inserted space.
            - **Pen Stabilization & 1-Euro Filter**: Real-time jitter smoothing with adjustable strength and crossover sliders.
            - **Stroke Engine Polish**: Capsule tangent ink rendering prevents Skia carving artifacts; calligraphy downstroke thickness; speed pen smoothing and top speed controls.
            - **Multiple App Icons**: Choose among 8 built-in app icons directly in the About pane.
            - **Xiaomi Focus Pen Pro**: Hardware pinch gesture mapped to stylus button click actions.
          - **zNotes Core Features**:
            - **Google Drive Cloud Sync**: Incremental background sync for `.xnote` and `.xcanvas` with native Google Sign-In SDK.
            - **Multi-Note Tabs**: Switch between multiple open documents seamlessly.
            - **Exact Lasso Tool**: Pixel-perfect geometric selection and splitting on straight lines and shapes.
            - **Finger Drag**: Directly move selected objects with fingers.
            - **Collapsible Floating Toolbar**: Smooth fade animations without canvas shift.
            - **Audio Recording & Playback**: Synced playback attached to notes.
            - **Hierarchical Table of Contents (TOC)**: Note and PDF outlines in the side panel.

          ### Installation
          Download and install **`zNotes-v${{ env.VERSION_NAME }}.apk`** below.
          EOF

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: znotes-apk
          path: release-apks/*
          retention-days: 14

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG_NAME="${{ inputs.tag_name }}"
          else
            TAG_NAME="v${{ env.VERSION_NAME }}"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: zNotes ${{ steps.release_info.outputs.tag_name }}
          prerelease: false
          body_path: release-notes.md
          files: release-apks/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
